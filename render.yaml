# Render Blueprint: New > Blueprint > pick this repo.
# Render asks for the "sync: false" values when you create it.
services:
  - type: web
    name: senko-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    # "free" works for chat, but has 512 MB RAM and sleeps after 15 min idle.
    # A headless browser needs more; use "standard" (2 GB) if Agent mode crashes.
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSWORD # browser asks for it once; any username works
        sync: false
      - key: GROQ_API_KEY # free key at https://console.groq.com/keys
        sync: false
      - key: OPENROUTER_API_KEY # optional
        sync: false
      - key: OLLAMA_URL # optional: your own Ollama reachable over the internet
        sync: false
      - key: LLM_PROVIDER
        value: auto
