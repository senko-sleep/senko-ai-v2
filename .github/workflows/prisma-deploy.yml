name: prisma-deploy

# Deploys the app to the Prisma project "senko-ai" (module.ts).
# Pushes to the default branch deploy to production; other branches get a preview.
on:
  push:
  delete:

concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: prisma/cloud-deploy-action@v1
        id: deploy
        env:
          NEXT_OUTPUT_STANDALONE: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        with:
          module: module.ts
          # Webpack, not Turbopack: Turbopack renames external packages to hashed aliases
          # (pg-587764f78a6c7a9c) that the per-function bundle doesn't ship, so `pg` fails to load.
          build-command: npx next build --webpack

  teardown:
    # Branch previews are also cleaned up by the Prisma Console's branch automation.
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - uses: prisma/cloud-deploy-action@v1
        with:
          mode: destroy
          stage: ${{ github.event.ref }}
